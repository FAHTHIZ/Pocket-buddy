apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Keep developer builds multi-ABI by default; CI can override this property
// to produce a smaller ARM64 debug APK for testing on physical Android phones.
def reactNativeArchitectures = (project.findProperty("reactNativeArchitectures") ?: "arm64-v8a,armeabi-v7a,x86_64")
    .toString()
    .split(",")
    .collect { it.trim() }
    .findAll { it }

react {
    autolinkLibrariesWithApp()
}

android {
    namespace "com.pocketbuddy"
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "ai.pocketbuddy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters(*reactNativeArchitectures) }
    }

    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = false }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation("io.github.react-native-community:jsc-android:2026004.+")
    }
}
