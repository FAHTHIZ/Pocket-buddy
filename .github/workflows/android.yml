name: Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocket-buddy-android-v4-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Keep the test-distribution signing certificate stable across CI runs.
      # Production releases must use a private keystore supplied by the maintainer.
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pocket-buddy-test-signing-v1

      - name: Ensure test signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Install Android SDK and emulator components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64" \
            "ndk;27.3.13750724"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate pinned Gradle wrapper
        run: gradle -p android wrapper --gradle-version 9.4.1 --distribution-type bin

      - name: Commit reproducible build inputs to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git add package-lock.json android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Build inputs are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: commit npm lockfile and Gradle wrapper"
          if ! git push origin HEAD:main; then
            echo "::warning::Could not push generated build inputs. They remain available in the validation artifact."
          fi

      - name: TypeScript validation
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          echo "$code" > typecheck.exit
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=TypeScript validation::$line"
            done < typecheck.log
          fi
          exit "$code"

      - name: Build standalone ARM64 release APK
        if: success()
        id: android_release
        shell: bash
        run: |
          set +e
          bash android/gradlew -p android \
            -PreactNativeArchitectures=arm64-v8a \
            -PpocketBuddyUseDebugSigning=true \
            assembleRelease --stacktrace > android-release-build.log 2>&1
          code=$?
          tail -n 180 android-release-build.log
          echo "$code" > android-release.exit
          if [ "$code" -eq 0 ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/PocketBuddy.apk
          else
            echo "::error title=Android release build::Standalone ARM64 release build failed."
          fi
          exit "$code"

      - name: Build x86_64 release APK for emulator smoke test
        if: success()
        id: smoke_build
        shell: bash
        run: |
          set +e
          bash android/gradlew -p android \
            -PreactNativeArchitectures=x86_64 \
            -PpocketBuddyUseDebugSigning=true \
            assembleRelease --stacktrace > android-smoke-build.log 2>&1
          code=$?
          tail -n 140 android-smoke-build.log
          echo "$code" > android-smoke-build.exit
          if [ "$code" -eq 0 ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/PocketBuddy-smoke.apk
          else
            echo "::error title=Android emulator build::Could not create the x86_64 smoke-test APK."
          fi
          exit "$code"

      - name: Enable Linux KVM for Android emulator
        if: success()
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Mark emulator smoke-test start
        if: success()
        shell: bash
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > emulator-smoke.started
          echo "Prepared emulator smoke test."

      - name: Install, launch and verify the standalone app
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            trap 'code=$?; echo "$code" > emulator-smoke.exit; adb logcat -d > android-startup.log 2>/dev/null || true; exit "$code"' EXIT
            set -euo pipefail
            echo "Smoke script started at $(date -u +%FT%TZ)"
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb logcat -c
            adb install -r android/app/build/outputs/apk/release/PocketBuddy-smoke.apk
            adb shell am start -W -n ai.pocketbuddy/com.pocketbuddy.MainActivity
            sleep 25
            adb shell pidof ai.pocketbuddy
            adb shell dumpsys activity activities | grep -F 'com.pocketbuddy.MainActivity'
            adb logcat -d > android-startup.log
            if grep -E 'FATAL EXCEPTION|Unable to load script|ReactNativeJS.*(Error|error)' android-startup.log; then
              echo "Android startup log contains a fatal or JavaScript launch error."
              exit 1
            fi
            echo "Standalone APK installed and launched successfully."
      - name: Upload diagnostics and installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-buddy-validation
          path: |
            typecheck.log
            typecheck.exit
            android-release-build.log
            android-release.exit
            android-smoke-build.log
            android-smoke-build.exit
            android-startup.log
            emulator-smoke.started
            emulator-smoke.exit
            package-lock.json
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/build/outputs/apk/release/PocketBuddy.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publish standalone APK
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="android-build-${GITHUB_RUN_NUMBER}"
          apk="android/app/build/outputs/apk/release/PocketBuddy.apk"
          notes="Standalone ARM64 Android test APK. It includes the bundled React Native JavaScript and was installed and launched in an Android emulator smoke test. Signed with the CI test key; this is not a Play Store production signing identity."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "Pocket Buddy Android build ${GITHUB_RUN_NUMBER}" --notes "$notes"
          fi

      - name: Enforce validation results
        if: always()
        shell: bash
        run: |
          typecheck_code=$(cat typecheck.exit 2>/dev/null || echo missing)
          release_code=$(cat android-release.exit 2>/dev/null || echo missing)
          smoke_build_code=$(cat android-smoke-build.exit 2>/dev/null || echo missing)
          emulator_code=$(cat emulator-smoke.exit 2>/dev/null || echo missing)
          echo "TypeScript validation: $typecheck_code"
          echo "Standalone ARM64 release build: $release_code"
          echo "x86_64 smoke APK build: $smoke_build_code"
          echo "Emulator launch smoke test: $emulator_code"
          if [ "$typecheck_code" != "0" ] || [ "$release_code" != "0" ] || [ "$smoke_build_code" != "0" ] || [ "$emulator_code" != "0" ]; then
            exit 1
          fi
