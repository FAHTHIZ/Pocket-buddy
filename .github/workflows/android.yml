name: Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
      - name: Install Android 17 SDK components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.3.13750724"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          echo "$code" > typecheck.exit
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=TypeScript validation::$line"
            done < typecheck.log
          fi
          exit 0
      - name: Build Android debug APK
        id: android
        shell: bash
        run: |
          set +e
          gradle -p android assembleDebug --stacktrace > android-build.log 2>&1
          code=$?
          tail -n 160 android-build.log
          echo "$code" > android-build.exit
          if [ "$code" -ne 0 ]; then
            echo "::error title=Android build::Gradle assembleDebug failed. See android-build.log in the validation artifact."
          fi
          exit 0
      - name: Upload build diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-buddy-validation
          path: |
            typecheck.log
            typecheck.exit
            android-build.log
            android-build.exit
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce validation results
        if: always()
        shell: bash
        run: |
          typecheck_code=$(cat typecheck.exit 2>/dev/null || echo missing)
          android_code=$(cat android-build.exit 2>/dev/null || echo missing)
          echo "TypeScript validation: $typecheck_code"
          echo "Android build: $android_code"
          if [ "$typecheck_code" != "0" ] || [ "$android_code" != "0" ]; then
            exit 1
          fi
