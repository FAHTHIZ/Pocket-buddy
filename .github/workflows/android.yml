name: Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocket-buddy-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
      - name: Install Android 17 SDK components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.3.13750724"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Generate pinned Gradle wrapper
        run: gradle -p android wrapper --gradle-version 9.4.1 --distribution-type bin
      - name: Commit reproducible build inputs to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git add package-lock.json android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Build inputs are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: commit npm lockfile and Gradle wrapper"
          if ! git push origin HEAD:main; then
            echo "::warning::Could not push generated build inputs. They remain available in the validation artifact."
          fi
      - name: TypeScript validation
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          echo "$code" > typecheck.exit
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=TypeScript validation::$line"
            done < typecheck.log
          fi
          exit "$code"
      - name: Build Android debug APK
        if: always()
        id: android
        shell: bash
        run: |
          set +e
          bash android/gradlew -p android -PreactNativeArchitectures=arm64-v8a assembleDebug --stacktrace > android-build.log 2>&1
          code=$?
          tail -n 160 android-build.log
          echo "$code" > android-build.exit
          if [ "$code" -ne 0 ]; then
            echo "::error title=Android build::Gradle assembleDebug failed. See android-build.log in the validation artifact."
          fi
          exit "$code"
      - name: Prepare installable APK
        if: success()
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/PocketBuddy.apk
      - name: Upload build diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-buddy-validation
          path: |
            typecheck.log
            typecheck.exit
            android-build.log
            android-build.exit
            package-lock.json
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/PocketBuddy.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publish installable APK
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="android-build-${GITHUB_RUN_NUMBER}"
          apk="android/app/build/outputs/apk/debug/PocketBuddy.apk"
          notes="ARM64 Android test APK produced by the Pocket Buddy validation workflow. This is a debug-signed test build, not a production Play Store release."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "Pocket Buddy Android build ${GITHUB_RUN_NUMBER}" --notes "$notes"
          fi

      - name: Enforce validation results
        if: always()
        shell: bash
        run: |
          typecheck_code=$(cat typecheck.exit 2>/dev/null || echo missing)
          android_code=$(cat android-build.exit 2>/dev/null || echo missing)
          echo "TypeScript validation: $typecheck_code"
          echo "Android build: $android_code"
          if [ "$typecheck_code" != "0" ] || [ "$android_code" != "0" ]; then
            exit 1
          fi
