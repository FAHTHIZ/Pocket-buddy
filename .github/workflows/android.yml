name: Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
      - name: Install Android 17 SDK components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.3.13750724"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=TypeScript validation::$line"
            done < typecheck.log
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build Android debug APK
        id: android
        shell: bash
        run: |
          set +e
          gradle -p android assembleDebug --stacktrace > android-build.log 2>&1
          code=$?
          tail -n 160 android-build.log
          if [ "$code" -ne 0 ]; then
            echo "::error title=Android build::Gradle assembleDebug failed. See android-build.log artifact for details."
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-buddy-validation-\${{ github.run_number }}
          path: |
            typecheck.log
            android-build.log
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce validation results
        if: always()
        shell: bash
        env:
          TYPECHECK_EXIT_CODE: \${{ steps.typecheck.outputs.exit_code }}
          ANDROID_EXIT_CODE: \${{ steps.android.outputs.exit_code }}
        run: |
          if [ "$TYPECHECK_EXIT_CODE" != "0" ] || [ "$ANDROID_EXIT_CODE" != "0" ]; then
            echo "TypeScript exit: \${TYPECHECK_EXIT_CODE:-not run}"
            echo "Android build exit: \${ANDROID_EXIT_CODE:-not run}"
            exit 1
          fi
